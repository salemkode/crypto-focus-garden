<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Focus Garden</title>
  <desc id="desc">A moss-green sprout inside an open focus ring, finished with a sun-gold progress tip on a pale garden background.</desc>
  <rect id="background" width="1024" height="1024" fill="#EEF3F0"/>
  <!-- The open ring measures a session; its gold tip marks progress. -->
  <g id="focus-ring" fill="none" stroke-width="60" stroke-linecap="round">
    <path stroke="#2A6E27" d="M512 186 A326 326 0 1 0 794.324 349"/>
    <path stroke="#F2B53C" d="M794.324 349 A326 326 0 0 0 675 229.676"/>
  </g>
  <!-- Two broad leaves and a sturdy stem stay legible at Settings size. -->
  <g id="sprout" fill="#2A6E27">
    <path d="M512 568 C392 582 324 510 332 404 C448 391 524 461 512 568Z"/>
    <path d="M512 510 C498 394 565 317 690 322 C702 438 636 516 512 510Z"/>
    <path d="M512 496 V698" fill="none" stroke="#2A6E27" stroke-width="48" stroke-linecap="round"/>
  </g>
</svg>
